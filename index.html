<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Task List</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Inter", sans-serif;
                background-color: #f4f5f7;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .task-card {
                background: #ffffff;
                width: 100%;
                max-width: 520px;
                padding: 40px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            }

            .task-title {
                font-size: 28px;
                font-weight: 700;
                color: #1a202c;
                text-align: center;
                margin-bottom: 32px;
            }

            .task-section {
                margin-bottom: 24px;
            }

            .section-label {
                display: block;
                font-size: 12px;
                font-weight: 700;
                color: #718096;
                letter-spacing: 0.05em;
                margin-bottom: 8px;
            }

            .add-task-wrapper {
                display: flex;
                gap: 12px;
            }

            input[type="text"] {
                flex: 1;
                padding: 12px 16px;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                font-size: 14px;
                color: #2d3748;
                outline: none;
                transition: border-color 0.2s;
            }

            input[type="text"]:focus {
                border-color: #4a5568;
            }

            .add-btn {
                background-color: #333d4f;
                color: #ffffff;
                border: none;
                padding: 0 20px;
                border-radius: 8px;
                font-weight: 600;
                font-size: 14px;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .add-btn:hover {
                background-color: #1a202c;
            }

            .task-list {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .task-item {
                display: flex;
                align-items: center;
                background-color: #f8fafc;
                border: 1px solid #edf2f7;
                padding: 14px 16px;
                border-radius: 8px;
                cursor: pointer;
                transition:
                    background-color 0.2s,
                    border-color 0.2s;
            }

            .task-item:hover {
                background-color: #f1f5f9;
            }

            /* Hide default checkbox */
            .task-item input[type="checkbox"] {
                position: absolute;
                opacity: 0;
                cursor: pointer;
            }

            /* Custom Checkbox Frame */
            .checkmark {
                position: relative;
                height: 20px;
                width: 20px;
                background-color: #ffffff;
                border: 1px solid #cbd5e1;
                border-radius: 4px;
                margin-right: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s;
                flex-shrink: 0;
            }

            /* Checkbox State: Checked Background */
            .task-item input[type="checkbox"]:checked + .checkmark {
                background-color: #333d4f;
                border-color: #333d4f;
            }

            /* Checkmark Icon */
            .task-item input[type="checkbox"]:checked + .checkmark::after {
                content: "";
                position: absolute;
                left: 6px;
                top: 2px;
                width: 5px;
                height: 10px;
                border: solid white;
                border-width: 0 2px 2px 0;
                transform: rotate(45deg);
            }

            .task-text {
                font-size: 15px;
                color: #2d3748;
                font-weight: 500;
                transition: color 0.2s;
            }

            /* Strike-through when associated checkbox is checked */
            .task-item input[type="checkbox"]:checked ~ .task-text {
                color: #a0aec0;
                text-decoration: line-through;
            }
        </style>
    </head>
    <body>
        <div class="task-card">
            <h1 class="task-title">My Task List</h1>

            <form class="task-section" id="task-form">
                <label class="section-label" for="new-task">ADD A TASK</label>
                <div class="add-task-wrapper">
                    <input
                        type="text"
                        id="new-task"
                        placeholder="Enter a new task"
                    />
                    <button class="add-btn" type="submit">Add Task</button>
                </div>
            </form>

            <div class="task-section">
                <span class="section-label">TASKS</span>
                <div class="task-list" id="task-list"></div>
                <button id="exportTasks">Export Tasks</button>
            </div>
        </div>

        <script src="assets/js/tasklist.js"></script>
    </body>
</html>
